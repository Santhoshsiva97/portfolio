<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Email signature</title>
  </head>
  <body style="margin: 24px; background: #ffffff">
    <!--
      Open this file in a browser, select the signature below (Ctrl+A), copy it and paste it into
      Gmail → Settings → General → Signature. Inline styles and a table are used on purpose:
      email clients ignore stylesheets.
    -->
    <table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; color: #15161a">
      <tr>
        <td style="padding-right: 14px; vertical-align: top">
          <div
            style="width: 44px; height: 44px; border-radius: 12px; background: #15161a; color: #ff4f1a; font-size: 26px; line-height: 44px; text-align: center; font-weight: bold"
          >
            &bull;
          </div>
        </td>
        <td style="border-left: 2px solid #ff4f1a; padding-left: 14px; vertical-align: top">
          <div style="font-size: 15px; font-weight: bold">Santhosh Sivakumar</div>
          <div style="font-size: 13px; color: #5b5d66; margin-top: 2px">
            Full Stack Software Engineer &middot; Web apps, Shopify stores &amp; automation
          </div>
          <div style="font-size: 13px; margin-top: 6px">
            <a href="https://YOUR-SITE" style="color: #c2380c; text-decoration: none; font-weight: bold">YOUR-SITE</a>
            &nbsp;&middot;&nbsp;
            <a href="https://github.com/Santhoshsiva97" style="color: #2f45ff; text-decoration: none">GitHub</a>
            &nbsp;&middot;&nbsp;
            <a href="https://YOUR-SITE/resume" style="color: #2f45ff; text-decoration: none">Resume</a>
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
